name: Build wallpaper release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release archive
        shell: bash
        run: |
          version="${{ steps.release.outputs.tag }}"
          archive="WallpaperRotator-${version}.zip"
          zip -r "$archive" \
            README.txt LICENSE \
            install-wallpaper-rotator.ps1 \
            wallpapers.ps1 \
            run-wallpaper-hidden.vbs \
            create-wallpaper-shortcuts.ps1 \
            clear-wallpaper-history.ps1 \
            cycle-wallpaper-mode.ps1 \
            pause-wallpapers.ps1 \
            wallpaper-status.ps1 \
            Standard Ultrawide
          sha256sum "$archive" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.tag }}"
          gh release create "$version" \
            "WallpaperRotator-${version}.zip" \
            SHA256SUMS.txt \
            --title "Wallpaper Rotator ${version}" \
            --generate-notes
